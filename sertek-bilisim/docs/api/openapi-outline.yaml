# SERTEK BİLİŞİM MERKEZİ — API Sözleşme Taslağı (Aşama 1)
#
# Bu dosya üst düzey kaynak/endpoint planını gösterir; şema detayları (request/response
# body'leri) Aşama 2'de FastAPI + Pydantic modellerinden otomatik üretilecek gerçek
# OpenAPI/Swagger dokümanına dönüşecektir. Burada amaç kaynakların ve yetki
# gereksinimlerinin baştan netleşmesidir.

openapi: 3.0.3
info:
  title: SERTEK BİLİŞİM MERKEZİ API
  version: "0.1.0-planlama"
tags:
  - name: auth
  - name: products
  - name: categories
  - name: brands
  - name: stock
  - name: suppliers
  - name: channels
  - name: orders
  - name: crm
  - name: meta-leads
  - name: pricing
  - name: reports
  - name: integration-logs
  - name: settings
paths:
  /api/v1/auth/login:
    post: { tags: [auth], summary: "E-posta/şifre ile giriş, JWT + refresh token döner", security: [] }
  /api/v1/auth/refresh:
    post: { tags: [auth], summary: "Refresh token ile yeni access token" }
  /api/v1/auth/me:
    get: { tags: [auth], summary: "Giriş yapmış kullanıcı bilgisi" }

  /api/v1/products:
    get: { tags: [products], summary: "Ürün listesi (filtre: kategori, marka, durum, arama)" }
    post: { tags: [products], summary: "Yeni ürün oluştur", x-roles: [admin, yonetici, urun_yoneticisi] }
  /api/v1/products/{id}:
    get: { tags: [products] }
    put: { tags: [products], x-roles: [admin, yonetici, urun_yoneticisi] }
    delete: { tags: [products], x-roles: [admin] }
  /api/v1/products/{id}/channels:
    get: { tags: [products], summary: "Ürünün kanal bazlı yayın durumu" }
    post: { tags: [products], summary: "Ürünü seçili kanallara gönder/güncelle" }
  /api/v1/products/import/excel:
    post: { tags: [products], summary: "Excel/CSV toplu ürün içe aktarma" }
  /api/v1/products/export:
    get: { tags: [products], summary: "Excel/CSV dışa aktarma" }
  /api/v1/products/bulk-price:
    post: { tags: [products], summary: "Toplu fiyat güncelleme" }
  /api/v1/products/bulk-stock:
    post: { tags: [products], summary: "Toplu stok güncelleme" }

  /api/v1/categories: { get: { tags: [categories] }, post: { tags: [categories] } }
  /api/v1/brands: { get: { tags: [brands] }, post: { tags: [brands] } }

  /api/v1/stock/{product_id}:
    get: { tags: [stock], summary: "Fiziksel/rezerve/satılabilir/kanal stok detayı" }
  /api/v1/stock/{product_id}/adjust:
    post: { tags: [stock], summary: "Manuel stok düzeltme (stock_movements'a kayıt düşer)" }
  /api/v1/stock/movements:
    get: { tags: [stock], summary: "Stok hareket geçmişi" }

  /api/v1/suppliers: { get: { tags: [suppliers] }, post: { tags: [suppliers] } }
  /api/v1/suppliers/{id}/test-connection:
    post: { tags: [suppliers], summary: "XML kaynağına gerçek bağlantı testi" }
  /api/v1/suppliers/{id}/sync:
    post: { tags: [suppliers], summary: "Manuel senkronizasyon tetikle (Celery task)" }
  /api/v1/suppliers/{id}/preview:
    get: { tags: [suppliers], summary: "XML'den ürünleri önizle, eşleştirilmemişleri listele" }
  /api/v1/suppliers/{id}/match:
    post: { tags: [suppliers], summary: "supplier_product -> product eşleştirme" }

  /api/v1/channels: { get: { tags: [channels] }, post: { tags: [channels] } }
  /api/v1/channels/{id}/test-connection:
    post: { tags: [channels], summary: "Kanala gerçek API çağrısı ile bağlantı testi" }
  /api/v1/channels/{id}/sync-orders:
    post: { tags: [channels], summary: "Kanaldan siparişleri manuel çek" }
  /api/v1/channels/{id}/toggle:
    post: { tags: [channels], summary: "Kanalı aç/kapat" }

  /api/v1/orders: { get: { tags: [orders], summary: "Tüm kanallardan siparişler, filtrelenebilir" } }
  /api/v1/orders/{id}: { get: { tags: [orders] } }
  /api/v1/orders/{id}/status: { post: { tags: [orders], summary: "Durum güncelle" } }

  /api/v1/customers: { get: { tags: [crm] }, post: { tags: [crm] } }
  /api/v1/customers/{id}/merge: { post: { tags: [crm], summary: "Aynı telefonlu müşterileri birleştir" } }
  /api/v1/leads: { get: { tags: [crm] }, post: { tags: [crm] } }
  /api/v1/leads/{id}: { get: { tags: [crm] }, put: { tags: [crm] } }
  /api/v1/leads/{id}/notes: { post: { tags: [crm] } }
  /api/v1/leads/{id}/stage: { post: { tags: [crm], summary: "Satış aşaması değiştir" } }
  /api/v1/lead-stages: { get: { tags: [crm] }, post: { tags: [crm], summary: "Özel aşama tanımla" } }
  /api/v1/quotes: { post: { tags: [crm], summary: "Teklif oluştur" } }

  /api/v1/webhooks/meta-leads:
    get: { tags: [meta-leads], summary: "Meta webhook doğrulama (hub.challenge)", security: [] }
    post: { tags: [meta-leads], summary: "Meta lead webhook alıcı", security: [] }
  /api/v1/webhooks/woocommerce/{site_id}:
    post: { tags: [channels], summary: "WooCommerce sipariş/stok webhook alıcı", security: [] }

  /api/v1/pricing/simulate:
    post: { tags: [pricing], summary: "Alış fiyatı + komisyon + kargo -> net kâr simülasyonu" }

  /api/v1/reports/sales: { get: { tags: [reports] } }
  /api/v1/reports/profit: { get: { tags: [reports] } }
  /api/v1/reports/stock: { get: { tags: [reports] } }

  /api/v1/integration-logs: { get: { tags: [integration-logs], summary: "Tüm kanal/tedarikçi senkron logları" } }
  /api/v1/integration-logs/{id}/retry: { post: { tags: [integration-logs] } }

  /api/v1/settings: { get: { tags: [settings] }, put: { tags: [settings], x-roles: [admin] } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
