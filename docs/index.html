<title>Dijital Kartvizitler</title>
<meta name="description" content="Ekip dijital kartvizit dizini">
<meta name="theme-color" content="#16181A">
<link rel="canonical" href="https://kart.techburda.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Sertek Yazılım ve Bilişim Teknolojileri — Dijital Kartvizitler">
<meta property="og:description" content="Ekip üyelerimizin dijital kartvizitine ulaşmak için seçin.">
<meta property="og:url" content="https://kart.techburda.com/">
<meta property="og:image" content="https://kart.techburda.com/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sertek Yazılım ve Bilişim Teknolojileri — Dijital Kartvizitler">
<meta name="twitter:description" content="Ekip üyelerimizin dijital kartvizitine ulaşmak için seçin.">
<meta name="twitter:image" content="https://kart.techburda.com/assets/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/card.css">
</head>
<body>
  <div class="dir">
    <div class="dir-header" id="dirHeader"></div>
    <div class="dir-list" id="dirList"></div>
  </div>

  <script src="assets/card.js"></script>
  <script>
    // Yeni çalışan eklemek için buraya bir satır ekleyin ve
    // docs/<slug>/index.html + docs/<slug>/<isim>.vcf dosyalarını oluşturun.
    var employees = [
      { slug: "serhan", name: "Serhan Merkit", org: "Sertek Yazılım ve Bilişim Teknolojileri" },
      { slug: "aykut", name: "Aykut Ay", org: "Sertek Yazılım ve Bilişim Teknolojileri" }
    ];

    document.getElementById('dirHeader').innerHTML =
      TechburdaCard.markHtml('assets/logo-mark.png') + '<h1>Dijital Kartvizitler</h1><p>Ekip üyelerimizin kartvizitine ulaşmak için seçin</p>';

    function initials(name) {
      return name.split(' ').map(function (p) { return p[0]; }).join('').slice(0, 2).toUpperCase();
    }

    document.getElementById('dirList').innerHTML = employees.map(function (e) {
      return '<a class="dir-item" href="' + e.slug + '/">' +
        '<span class="dir-avatar">' + initials(e.name) + '</span>' +
        '<span class="dir-text"><span class="dir-name">' + e.name + '</span>' +
        '<span class="dir-org">' + e.org + '</span></span>' +
        '<span class="dir-arrow">›</span></a>';
    }).join('');
  </script>
</body>
</html>
